site_name: AgenticAI Framework
site_description: Zero-dependency Python SDK for building AI agents - multi-agent orchestration, tool calling, MCP, RAG, memory, guardrails, evaluation and tracing for OpenAI, Anthropic, Gemini and local LLMs
site_author: Sathishkumar Nagarajan
site_url: https://isathish.github.io/agenticaiframework/
repo_url: https://github.com/isathish/agenticaiframework
repo_name: isathish/agenticaiframework
edit_uri: edit/main/docs/

