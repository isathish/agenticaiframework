# Extra
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/isathish/agenticaiframework
    name: GitHub Repository
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/agenticaiframework/
    name: PyPI Package
  - icon: fontawesome/solid/book
    link: https://isathish.github.io/agenticaiframework/
    name: Documentation
  keywords: >-
    agentic ai, ai agents, python agent framework, multi-agent orchestration,
    llm orchestration, tool calling, function calling, model context protocol, mcp,
    rag, retrieval augmented generation, agent memory, guardrails, llm evaluation,
    llm tracing, openai, anthropic, claude, gemini, ollama, zero dependency python sdk
  version:
    provider: mike
    default: latest
  generator: false
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well as to measure the effectiveness of our documentation and whether users find what they're searching for. With your consent, you're helping us to make our documentation better.
    actions:
    - accept
    - reject
    - manage
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    feedback:
      title: Was this page helpful?
      ratings:
      - icon: material/emoticon-happy-outline
        name: This page was helpful
        data: 1
        note: >-
          Thanks for your feedback.
      - icon: material/emoticon-sad-outline
        name: This page could be improved
        data: 0
        note: >-
          Thanks for your feedback! Help us improve by  <a href="https://github.com/isathish/agenticaiframework/issues/new?template=documentation.md" target="_blank" rel="noopener">opening an issue</a>.
  status:
    new: Recently added
    deprecated: Deprecated
